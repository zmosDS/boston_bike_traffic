<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boston BlueBike Traffic</title>

  <!-- Global stylesheet -->
  <link rel="stylesheet" href="global.css" />

  <!-- Map stylesheet -->
  <link rel="stylesheet" href="map.css" />

  <!-- Mapbox GL JS CSS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
        rel="stylesheet" />

  <script src="map.js" type="module"></script>
</head>

<body>

  <header>
    <h1>🚴🏼‍♀️ Boston BlueBike Traffic</h1>

    <label id="time-filter">
      Filter by time:
      <input id="time-slider" type="range" min="-1" max="1440" value="-1" />
      <time id="time-display"></time>
      <em id="any-time">(any time)</em>
    </label>
  </header>

  <div id="map">
    <svg></svg>
  </div>

  <div class="legend">
    <div class="legend-item">
      <span class="swatch arrivals"></span>
      <span>More arrivals</span>
    </div>

    <div class="legend-item">
      <span class="swatch balanced"></span>
      <span>Balanced</span>
    </div>

    <div class="legend-item">
      <span class="swatch departures"></span>
      <span>More departures</span>
    </div>
  </div>

</body>
</html>
